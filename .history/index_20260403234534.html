<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <title>中东地区地图 - 精确国界</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 15px 30px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #e8e8e8;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e8e8e8;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toggle-btn.active {
            background: #4169E1;
            border-color: #4169E1;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .country-label {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 6px;
            padding: 5px 10px;
            font-weight: 600;
            font-size: 13px;
            color: #222;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .country-label .flag {
            font-size: 14px;
        }

        .leaflet-tooltip,
        .custom-tooltip {
            background: linear-gradient(145deg, #1e2a4a 0%, #16213e 100%) !important;
            border: 1px solid #0f3460 !important;
            border-radius: 10px !important;
            color: #e8e8e8 !important;
            padding: 12px 15px !important;
            font-size: 12px !important;
            line-height: 1.6 !important;
            width: 320px !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5) !important;
            white-space: normal !important;
        }

        .leaflet-tooltip::before,
        .custom-tooltip::before {
            border-right-color: #16213e !important;
        }

        .leaflet-tooltip-top:before,
        .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-left:before,
        .leaflet-tooltip-right:before,
        .custom-tooltip-top:before,
        .custom-tooltip-bottom:before,
        .custom-tooltip-left:before,
        .custom-tooltip-right:before {
            border-top-color: #16213e !important;
        }

        .tooltip-title {
            font-size: 15px !important;
            font-weight: 700 !important;
            color: #fff !important;
            margin-bottom: 8px !important;
            padding-bottom: 6px !important;
            border-bottom: 1px solid #0f3460 !important;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tooltip-title .flag {
            font-size: 18px;
        }

        .tooltip-subtitle {
            font-size: 12px;
            color: #8fa3bf;
            font-weight: 500;
            margin-top: 6px;
            margin-bottom: 3px;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tooltip-label {
            color: #8fa3bf !important;
            font-weight: 500;
        }

        .tooltip-value {
            color: #fff !important;
            font-weight: 600;
            text-align: right;
            max-width: none;
            word-break: break-word;
            white-space: normal !important;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 14px;
            color: #e8e8e8;
            font-size: 11px;
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
            min-width: 160px;
        }

        .legend h4 {
            margin-bottom: 8px;
            font-weight: 600;
            color: #fff;
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 3px 0;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .zoom-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e8e8e8;
            font-size: 11px;
            z-index: 1000;
        }

        .zoom-info strong {
            color: #fff;
        }

        /* 国家信息面板 */
        .country-info-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            left: auto;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid rgba(15, 52, 96, 0.6);
            border-radius: 10px;
            padding: 12px 15px;
            color: #e8e8e8;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            min-width: 420px;
            max-width: 480px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .panel-flag {
            font-size: 36px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .panel-content {
            width: 100%;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(15, 52, 96, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 10px;
            font-size: 11px;
        }

        .panel-item {
            display: flex;
            gap: 3px;
        }

        .panel-label {
            color: #8fa3bf;
            font-weight: 500;
        }

        .panel-value {
            color: #fff;
            font-weight: 600;
            word-break: break-word;
        }

        .panel-section-title {
            grid-column: 1 / -1;
            color: #fff;
            font-weight: 600;
            font-size: 11px;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px dashed rgba(15, 52, 96, 0.6);
        }

        .allies-value {
            color: #22c55e;
        }

        .enemies-value {
            color: #ef4444;
        }

        /* 航线起止点发光效果 */
        .arc-start-marker,
        .arc-end-marker {
            box-shadow: 0 0 8px 2px currentColor;
            animation: arcPulse 2s ease-in-out infinite;
        }

        @keyframes arcPulse {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

</head>

            return null;

        // 生成抛物线点（贝塞尔曲线）
        function getArcPoints(start, end, segments = 50) {
            const points = [];
            const midLat = (start[0] + end[0]) / 2;
            const midLng = (start[1] + end[1]) / 2;

            // 计算距离来确定弧度高度
            const distance = Math.sqrt(
                Math.pow(end[0] - start[0], 2) +
                Math.pow(end[1] - start[1], 2)
            );
            const arcHeight = distance * 0.35; // 弧度高度为距离的35%，更高

            // 弧顶坐标（在两点连线的中点上方）
            const peakLat = midLat + arcHeight;
            const peakLng = midLng;

            // 生成贝塞尔曲线点
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                // 二次贝塞尔曲线公式
                const lat = Math.pow(1 - t, 2) * start[0] +
                    2 * (1 - t) * t * peakLat +
                    Math.pow(t, 2) * end[0];
                const lng = Math.pow(1 - t, 2) * start[1] +
                    2 * (1 - t) * t * peakLng +
                    Math.pow(t, 2) * end[1];
                points.push([lat, lng]);
            }
            return points;
        }

                            show: true,
                            position: 'right',
                            color: '#e8e8e8',
                            fontSize: 9,
                            formatter: '{c}'
                        }
                    },
                    {
                        name: '人口占比',
                        type: 'bar',
                        data: popData,
                        itemStyle: {
                            color: function (params) {
                                return colors[params.dataIndex];
                            },
                            opacity: 0.5,
                            borderRadius: [0, 4, 4, 0]
                        },
                        barWidth: '35%',
                        label: {
                            show: false
                        }
                    }
                ]
            };

            chartInstance.setOption(option);
        }

        function hideCountryInfoPanel() {
            const panel = document.getElementById('countryInfoPanel');
            panel.style.display = 'none';

            // 销毁 echarts 图表实例
            const chartDom = document.getElementById('factionChart');
            if (chartDom) {
                const chartInstance = echarts.getInstanceByDom(chartDom);
                if (chartInstance) {
                    chartInstance.dispose();
                }
            }
        }


        function drawRelationshipLines(countryName) {
            // 清除之前的关系线
            if (relationshipLinesLayer) {
                map.removeLayer(relationshipLinesLayer);
            }
            relationshipLinesLayer = L.layerGroup();

            const details = countryDetails[countryName];
            if (!details) return;

            const center = countryCenters[countryName];
            if (!center) return;

            // 解析盟友和敌对国家
            const parseCountries = (str) => {
                if (!str) return [];
                return str.split(/[、,，]/).map(s => s.trim()).filter(s => s);
            };

            const allies = parseCountries(details.allies);
            const enemies = parseCountries(details.enemies);

            // 绘制盟友线（绿色）- 抛物线
            allies.forEach(allyName => {
                const key = nameToKey[allyName] || allyName;
                const allyCenter = countryCenters[key];
                if (allyCenter) {
                    const arcPoints = getArcPoints(center, allyCenter);
                    const polyline = L.polyline(arcPoints, {
                        color: '#22c55e',
                        weight: 1.5,
                        opacity: 0.8
                    });
                    relationshipLinesLayer.addLayer(polyline);

                    // 起点标记 - 发光圆形
                    // const startMarker = L.circleMarker([center[0], center[1]], {
                    //     radius: 5,
                    //     fillColor: '#22c55e',
                    //     fillOpacity: 0.9,
                    //     color: '#fff',
                    //     weight: 1.5,
                    //     className: 'arc-start-marker'
                    // });
                    // relationshipLinesLayer.addLayer(startMarker);

                    // 终点标记 - 发光圆形
                    const endMarker = L.circleMarker([allyCenter[0], allyCenter[1]], {
                        radius: 5,
                        fillColor: '#22c55e',
                        fillOpacity: 0.9,
                        color: '#fff',
                        weight: 1.5,
                        className: 'arc-end-marker'
                    });
                    relationshipLinesLayer.addLayer(endMarker);
                }
            });

            // 绘制敌对线（红色）- 抛物线
            enemies.forEach(enemyName => {
                const key = nameToKey[enemyName] || enemyName;
                const enemyCenter = countryCenters[key];
                if (enemyCenter) {
                    const arcPoints = getArcPoints(center, enemyCenter);
                    const polyline = L.polyline(arcPoints, {
                        color: '#ef4444',
                        weight: 1.5,
                        opacity: 0.8
                    });
                    relationshipLinesLayer.addLayer(polyline);

                    // 起点标记 - 发光圆形
                    const startMarker = L.circleMarker([center[0], center[1]], {
                        radius: 5,
                        fillColor: '#ef4444',
                        fillOpacity: 0.9,
                        color: '#fff',
                        weight: 1.5,
                        className: 'arc-start-marker'
                    });
                    relationshipLinesLayer.addLayer(startMarker);

                    // 终点标记 - 发光圆形
                    const endMarker = L.circleMarker([enemyCenter[0], enemyCenter[1]], {
                        radius: 5,
                        fillColor: '#ef4444',
                        fillOpacity: 0.9,
                        color: '#fff',
                        weight: 1.5,
                        className: 'arc-end-marker'
                    });
                    relationshipLinesLayer.addLayer(endMarker);
                }
            });

            relationshipLinesLayer.addTo(map);
        }

        function clearRelationshipLines() {
            if (relationshipLinesLayer) {
                map.removeLayer(relationshipLinesLayer);
                relationshipLinesLayer = null;
            }
        }

        // ==================== 加载精确边界数据 ====================
        async function loadBoundaryData() {
            try {
                // 加载精确国家边界
                const countriesResponse = await fetch('./me-countries.geojson');
                preciseCountriesGeoJSON = await countriesResponse.json();
                console.log('精确国家边界数据已加载:', preciseCountriesGeoJSON.features.length, '个国家');
            } catch (error) {
                console.error('加载国家边界数据失败:', error);
            }
        }

        // ==================== 创建 Tooltip 内容 ====================
        function createCountryTooltip(countryName, countryInfo) {
            const details = countryDetails[countryName];
            if (!details) {
                return `<div class="tooltip-title"><span class="flag">${countryInfo.flag}</span>${countryInfo.name}</div>`;
            }
            return `
                <div class="tooltip-title"><span class="flag">${countryInfo.flag}</span>${countryInfo.name}</div>
                <div class="tooltip-row"><span class="tooltip-label">政权:</span><span class="tooltip-value">${details.regime}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">类型:</span><span class="tooltip-value">${details.regimeType}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">领袖:</span><span class="tooltip-value">${details.leader}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">意识形态:</span><span class="tooltip-value">${details.ideology}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">民族:</span><span class="tooltip-value">${details.ethnicity}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">宗教:</span><span class="tooltip-value">${details.religion}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">人口:</span><span class="tooltip-value">${details.population}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">经济:</span><span class="tooltip-value">${details.economy}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">盟友:</span><span class="tooltip-value">${details.allies || '-'}</span></div>
                <div class="tooltip-row"><span class="tooltip-label">敌对:</span><span class="tooltip-value">${details.enemies || '-'}</span></div>
            `;
        }

        // ==================== 创建图层 ====================
        function createCountriesLayer() {
            // 优先使用精确边界数据，否则使用嵌入数据
            const geoJSONData = preciseCountriesGeoJSON || countriesGeoJSON;
            return L.geoJSON(geoJSONData, {
                style: (feature) => {
                    const key = getCountryKey(feature.properties.name);
                    const info = key ? countryData[key] : null;
                    return {
                        fillColor: info?.color || '#888',
                        weight: 2, opacity: 1, color: 'white', fillOpacity: 0.6
                    };
                },
                onEachFeature: (feature, layer) => {
                    const key = getCountryKey(feature.properties.name);
                    if (!key) return;
                    layer.on({
                        click: (e) => {
                            // 清除之前的高亮
                            countriesLayer.eachLayer((l) => {
                                countriesLayer.resetStyle(l);
                            });
                            // 高亮当前国家
                            e.target.setStyle({ weight: 3, color: '#666', fillOpacity: 0.8 });
                            e.target.bringToFront();
                            updateCountryInfoPanel(key);
                            drawRelationshipLines(key);
                        }
                    });
                }
            });
        }

        function createCountryLabels() {
            return L.layerGroup();
        }

        // ==================== 模式切换 ====================
        function updateDisplay() {
            // 移除所有层
            if (countriesLayer) map.removeLayer(countriesLayer);
            if (countryLabelsLayer) map.removeLayer(countryLabelsLayer);

            if (!countriesLayer) countriesLayer = createCountriesLayer();
            if (!countryLabelsLayer) countryLabelsLayer = createCountryLabels();
            map.addLayer(countriesLayer);
            map.addLayer(countryLabelsLayer);
        }

        // ==================== 图例 ====================
        const legend = document.getElementById('legend');
        let legendHTML = '<h4>国家图例</h4>';
        for (const [, info] of Object.entries(countryData)) {
            legendHTML += `<div class="legend-item"><div class="legend-color" style="background:${info.color}"></div><span>${info.flag} ${info.name}</span></div>`;
        }
        legend.innerHTML = legendHTML;

        // ==================== 初始化 ====================
        // 先用嵌入数据显示，再异步加载精确数据
        updateDisplay();

        // 异步加载精确边界数据
        loadBoundaryData().then(() => {
            // 重新渲染当前层以使用精确数据
            if (countriesLayer) {
                map.removeLayer(countriesLayer);
                countriesLayer = createCountriesLayer();
                map.addLayer(countriesLayer);
            }
        });
    </script>
</body>
