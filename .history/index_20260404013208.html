<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中东地区地图 - 精确国界</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 15px 30px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #e8e8e8;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e8e8e8;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toggle-btn.active {
            background: #4169E1;
            border-color: #4169E1;
        }

        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }

        .country-label {
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        .country-label .flag {
            font-size: 14px;
        }

        .leaflet-tooltip,
        .custom-tooltip {
            background: linear-gradient(145deg, #1e2a4a 0%, #16213e 100%) !important;
            border: 1px solid #0f3460 !important;
            border-radius: 10px !important;
            color: #e8e8e8 !important;
            padding: 12px 15px !important;
            font-size: 12px !important;
            line-height: 1.6 !important;
            width: 320px !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5) !important;
            white-space: normal !important;
        }

        .leaflet-tooltip::before,
        .custom-tooltip::before {
            border-right-color: #16213e !important;
        }

        .leaflet-tooltip-top:before,
        .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-left:before,
        .leaflet-tooltip-right:before,
        .custom-tooltip-top:before,
        .custom-tooltip-bottom:before,
        .custom-tooltip-left:before,
        .custom-tooltip-right:before {
            border-top-color: #16213e !important;
        }

        .tooltip-title {
            font-size: 15px !important;
            font-weight: 700 !important;
            color: #fff !important;
            margin-bottom: 8px !important;
            padding-bottom: 6px !important;
            border-bottom: 1px solid #0f3460 !important;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tooltip-title .flag {
            font-size: 18px;
        }

        .tooltip-subtitle {
            font-size: 12px;
            color: #8fa3bf;
            font-weight: 500;
            margin-top: 6px;
            margin-bottom: 3px;
        }

        .tooltip-row {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tooltip-label {
            color: #8fa3bf !important;
            font-weight: 500;
        }

        .tooltip-value {
            color: #fff !important;
            font-weight: 600;
            text-align: right;
            max-width: none;
            word-break: break-word;
            white-space: normal !important;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 12px;
            color: #e8e8e8;
            font-size: 11px;
            z-index: 1000;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            min-width: 150px;
        }

        .legend-section {
            margin-bottom: 8px;
        }

        .legend-section:last-child {
            margin-bottom: 0;
        }

        .legend-section h4 {
            margin-bottom: 8px;
            font-weight: 600;
            color: #fff;
            font-size: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .legend-section:last-child h4 {
            margin-bottom: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            font-size: 13px;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .legend-item .flag {
            font-size: 18px;
        }

        .zoom-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e8e8e8;
            font-size: 11px;
            z-index: 1000;
        }

        .zoom-info strong {
            color: #fff;
        }

        /* 国家信息面板 */
        .country-info-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid rgba(15, 52, 96, 0.6);
            border-radius: 12px;
            padding: 16px;
            color: #e8e8e8;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 340px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-flag {
            font-size: 42px;
            line-height: 1;
        }

        .panel-title-group {
            flex: 1;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .panel-historical {
            font-size: 11px;
            color: #8fa3bf;
        }

        .panel-section {
            margin-bottom: 14px;
        }

        .panel-section-title {
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px 12px;
            font-size: 12px;
        }

        .panel-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .panel-label {
            color: #8fa3bf;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-value {
            color: #fff;
            font-weight: 500;
            word-break: break-word;
        }

        .panel-relations {
            margin-top: 4px;
        }

        .relation-row {
            margin-bottom: 6px;
        }

        .relation-row:last-child {
            margin-bottom: 0;
        }

        .relation-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .relation-label.allies {
            color: #22c55e;
        }

        .relation-label.enemies {
            color: #ef4444;
        }

        .relation-value {
            font-size: 11px;
            line-height: 1.4;
        }

        .allies-value {
            color: #22c55e;
        }

        .enemies-value {
            color: #ef4444;
        }

        .panel-charts {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .chart-item {
            flex: 1;
            text-align: center;
        }

        .chart-title {
            font-size: 10px;
            color: #8fa3bf;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container {
            height: 100px;
        }

        .chart-item.full {
            width: 100%;
        }

        #factionChart {
            width: 100%;
            height: 300px;
        }

        /* 航线起止点发光效果 */
        .arc-start-marker,
        .arc-end-marker {
            box-shadow: 0 0 6px 2px currentColor;
        }

        /* 资源标注样式 */
        .resource-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .resource-marker.oil {
            background: rgba(139, 69, 19, 0.9);
        }

        .resource-marker.gas {
            background: rgba(255, 140, 0, 0.9);
        }

        .resource-marker.river {
            background: rgba(30, 144, 255, 0.9);
        }

        .resource-marker.port {
            background: rgba(34, 139, 34, 0.9);
        }

        .resource-marker.strategic {
            background: rgba(220, 20, 60, 0.9);
        }

        /* 军事基地标注样式 */
        .military-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #fff;
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .military-marker.us {
            background: rgba(0, 0, 139, 0.9);
        }

        .military-marker.russian {
            background: rgba(139, 0, 0, 0.9);
        }

        .military-marker.strategic {
            background: rgba(128, 0, 128, 0.9);
        }

        /* 贸易路线标注 */
        .trade-marker {
            font-size: 14px;
        }

        /* 弹窗样式 */
        .marker-popup {
            font-size: 12px;
            line-height: 1.5;
            background: linear-gradient(145deg, #1e2a4a 0%, #16213e 100%);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px;
            color: #e8e8e8;
            min-width: 180px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .marker-popup h4 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 6px;
        }

        .marker-popup p {
            margin: 4px 0;
            color: #b8c5d9;
            font-size: 12px;
        }

        .marker-popup strong {
            color: #fff;
            font-weight: 500;
        }

        .marker-popup .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 6px;
            color: #fff;
            font-weight: 500;
        }

        .marker-popup .type-oil {
            background: rgba(139, 69, 19, 0.9);
        }

        .marker-popup .type-gas {
            background: rgba(255, 140, 0, 0.9);
        }

        .marker-popup .type-us {
            background: rgba(0, 0, 139, 0.9);
        }

        .marker-popup .type-russian {
            background: rgba(139, 0, 0, 0.9);
        }

        .marker-popup .type-shipping {
            background: rgba(34, 139, 34, 0.9);
        }

        /* Leaflet弹窗覆盖 */
        .leaflet-popup-content-wrapper {
            background: transparent !important;
            border-radius: 8px !important;
            box-shadow: none !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
        }

        .leaflet-popup-tip {
            background: #16213e !important;
        }

        .leaflet-popup-close-button {
            color: #fff !important;
            font-size: 18px !important;
            padding: 5px 8px !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>🗺️ 中东地区地图</h1>
        <div class="header-controls">
            <button class="toggle-btn active" id="btnCountry" title="国家">🗺️</button>
            <button class="toggle-btn active" id="btnLabel" title="国名">🔤</button>
            <button class="toggle-btn" id="btnRelation" title="国际关系">🔗</button>
            <button class="toggle-btn" id="btnResource" title="资源">⛽</button>
            <button class="toggle-btn" id="btnMilitary" title="军事">⚔️</button>
            <button class="toggle-btn" id="btnOilExport" title="石油输出">🛢️</button>
        </div>
    </header>

    <!-- 国家信息面板 -->
    <div id="countryInfoPanel" class="country-info-panel" style="display: none;">
        <div class="panel-header">
            <div class="panel-flag" id="panelFlag"></div>
            <div class="panel-title-group">
                <div class="panel-title" id="panelTitle"></div>
                <div class="panel-historical" id="panelHistorical"></div>
            </div>
        </div>
        <div class="panel-section">
            <div class="panel-section-title">基本信息</div>
            <div class="panel-grid" id="panelGrid"></div>
        </div>
        <div class="panel-section">
            <div class="panel-section-title">国际关系</div>
            <div class="panel-relations" id="panelRelations"></div>
        </div>
        <div class="panel-charts">
            <div id="factionChart"></div>
        </div>
    </div>

    <div id="map"></div>

    <div class="legend" id="legend"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        // ==================== 国家数据 ====================
        const countryData = {
            "Saudi Arabia": { flag: "🇸🇦", color: "#8B4513", name: "沙特阿拉伯" },
            "Iran": { flag: "🇮🇷", color: "#228B22", name: "伊朗" },
            "Iraq": { flag: "🇮🇶", color: "#CD853F", name: "伊拉克" },
            "Turkey": { flag: "🇹🇷", color: "#FF6347", name: "土耳其" },
            "Syria": { flag: "🇸🇾", color: "#DAA520", name: "叙利亚" },
            "Jordan": { flag: "🇯🇴", color: "#9ACD32", name: "约旦" },
            "Israel": { flag: "🇮🇱", color: "#4169E1", name: "以色列" },
            "Lebanon": { flag: "🇱🇧", color: "#87CEEB", name: "黎巴嫩" },
            "United Arab Emirates": { flag: "🇦🇪", color: "#2E8B57", name: "阿联酋" },
            "Qatar": { flag: "🇶🇦", color: "#9932CC", name: "卡塔尔" },
            "Bahrain": { flag: "🇧🇭", color: "#FF69B4", name: "巴林" },
            "Kuwait": { flag: "🇰🇼", color: "#20B2AA", name: "科威特" },
            "Oman": { flag: "🇴🇲", color: "#FF8C00", name: "阿曼" },
            "Yemen": { flag: "🇾🇪", color: "#808080", name: "也门" },
            "Egypt": { flag: "🇪🇬", color: "#FFD700", name: "埃及" },
            "Afghanistan": { flag: "🇦🇫", color: "#A0522D", name: "阿富汗" },
            "Pakistan": { flag: "🇵🇰", color: "#6B8E23", name: "巴基斯坦" },
            // 欧洲主要石油买家
            "United Kingdom": { flag: "🇬🇧", color: "#C8102E", name: "英国" },
            "France": { flag: "🇫🇷", color: "#0055A4", name: "法国" },
            "Germany": { flag: "🇩🇪", color: "#000000", name: "德国" },
            "Italy": { flag: "🇮🇹", color: "#008C45", name: "意大利" },
            "Spain": { flag: "🇪🇸", color: "#AA151B", name: "西班牙" },
            "Netherlands": { flag: "🇳🇱", color: "#FF6600", name: "荷兰" },
            "Greece": { flag: "🇬🇷", color: "#0D5EAF", name: "希腊" }
        };

        // 中文名到countryCenters键的映射
        const nameToKey = {
            "沙特阿拉伯": "Saudi Arabia", "沙特": "Saudi Arabia",
            "伊朗": "Iran",
            "伊拉克": "Iraq",
            "土耳其": "Turkey",
            "叙利亚": "Syria",
            "约旦": "Jordan",
            "以色列": "Israel",
            "黎巴嫩": "Lebanon",
            "阿联酋": "United Arab Emirates", "阿伯": "United Arab Emirates",
            "卡塔尔": "Qatar",
            "巴林": "Bahrain",
            "科威特": "Kuwait",
            "阿曼": "Oman",
            "也门": "Yemen",
            "埃及": "Egypt",
            "阿富汗": "Afghanistan",
            "巴基斯坦": "Pakistan",
            "美国": "United States",
            "俄罗斯": "Russia",
            "英国": "United Kingdom",
            "中国": "China",
            "日本": "Japan",
            "韩国": "South Korea",
            "印度": "India",
            "加拿大": "Canada",
            "巴西": "Brazil",
            "法国": "France",
            "德国": "Germany",
            "意大利": "Italy",
            "西班牙": "Spain",
            "荷兰": "Netherlands",
            "希腊": "Greece",
            "哈萨克斯坦": "Kazakhstan",
            "澳大利亚": "Australia",
            "南非": "South Africa",
            "尼日利亚": "Nigeria",
            "摩洛哥": "Morocco",
            "阿尔及利亚": "Algeria",
            "利比亚": "Libya",
            "阿塞拜疆": "Azerbaijan",
            // 非国家实体
            "黎巴嫩真主党": "黎巴嫩真主党", "真主党": "黎巴嫩真主党",
            "伊拉克民兵": "伊拉克民兵",
            "也门胡塞": "也门胡塞", "胡塞武装": "胡塞武装",
            "哈马斯": "哈马斯", "巴勒斯坦哈马斯": "哈马斯",
            "伊斯兰国": "伊斯兰国", "基地组织": "基地组织",
            "库尔德武装": "库尔德武装",
            "伊斯兰国呼罗珊分支": "伊斯兰国呼罗珊分支"
        };

        // 通过各种名称获取countryData的键
        function getCountryKey(name) {
            // 先检查是否是英文键
            if (countryData[name]) return name;
            // 再检查中文名映射
            if (nameToKey[name]) return nameToKey[name];
            // 遍历countryData，通过中文名匹配
            for (const [key, data] of Object.entries(countryData)) {
                if (data.name === name) return key;
            }
            return null;
        }

        // 根据国家名称获取旗帜
        function getCountryFlag(name) {
            const key = getCountryKey(name);
            if (key && countryData[key]) {
                return countryData[key].flag;
            }
            // 特殊实体的旗帜映射
            const flagMap = {
                "美国": "🇺🇸", "俄罗斯": "🇷🇺", "英国": "🇬🇧", "中国": "🇨🇳",
                "北约": "🅰️", "土耳其": "🇹🇷", "黎巴嫩真主党": "🔶",
                "伊拉克民兵": "🔶", "也门胡塞": "🔶", "哈马斯": "🔶",
                "胡塞武装": "🔶", "基地组织": "⚫", "伊斯兰国": "⚫",
                "库尔德武装": "🔶", "伊斯兰国呼罗珊分支": "⚫"
            };
            return flagMap[name] || '🏳️';
        }

        // 为盟友/敌对国家列表添加旗帜
        function formatCountriesWithFlags(countriesStr) {
            if (!countriesStr) return '-';
            const countries = countriesStr.split(/[、,，]/).map(s => s.trim()).filter(s => s);
            return countries.map(c => getCountryFlag(c) + ' ' + c).join('、');
        }

        // ==================== 国家势力派系数据 ====================
        const countryFactions = {
            "Saudi Arabia": {
                ethnicGroups: [
                    { name: "阿拉伯人", population: 90, color: "#8B4513" },
                    { name: "其他民族", population: 10, color: "#D2691E" }
                ],
                religions: [
                    { name: "伊斯兰教(逊尼派)", influence: 85, color: "#DAA520" },
                    { name: "伊斯兰教(什叶派)", influence: 10, color: "#228B22" },
                    { name: "其他", influence: 5, color: "#808080" }
                ],
                politicalPower: [
                    { name: "王室核心派系", power: 85, color: "#8B4513" },
                    { name: "宗教保守派", power: 70, color: "#D2691E" },
                    { name: "现代化改革派", power: 45, color: "#F4A460" },
                    { name: "商业精英阶层", power: 55, color: "#DEB887" },
                    { name: "军方势力", power: 50, color: "#556B2F" }
                ]
            },
            "Iran": {
                ethnicGroups: [
                    { name: "波斯人", population: 65, color: "#228B22" },
                    { name: "阿塞拜疆人", population: 16, color: "#32CD32" },
                    { name: "库尔德人", population: 10, color: "#6B8E23" },
                    { name: "其他民族", population: 9, color: "#9ACD32" }
                ],

            const layer = L.layerGroup();

            resourcesData.oilFields.forEach(field => {
                const iconHtml = `<div class="resource-marker ${field.type}" style="width:24px;height:24px;">⛽</div>`;
                const marker = L.marker(field.coords, {
                    icon: L.divIcon({
                        className: 'resource-icon',
                        html: iconHtml,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    })
                });

                const popupContent = `
                    <div class="marker-popup">
                        <h4>${field.name}</h4>
                        <p><span class="type-badge type-${field.type}">${field.type === 'oil' ? '油田' : '气田'}</span></p>
                        <p><strong>所属:</strong> ${field.country}</p>
                        <p><strong>储量:</strong> ${field.reserves}</p>
                    </div>
                `;
                marker.bindPopup(popupContent);
                layer.addLayer(marker);
            });

            // 水资源标注
            resourcesData.waterResources.forEach(water => {
                const iconHtml = `<div class="resource-marker river" style="width:20px;height:20px;">💧</div>`;

                    icon: L.divIcon({
                        className: 'resource-icon',
                        html: iconHtml,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    })
                });

                const popupContent = `
                    <div class="marker-popup">
                        <h4>${water.name}</h4>
                        <p><span class="type-badge" style="background:rgba(30,144,255,0.8);">河流</span></p>
                        <p><strong>流经:</strong> ${water.country}</p>
                    </div>
                `;
                marker.bindPopup(popupContent);
                layer.addLayer(marker);
            });

            // 港口标注

        // ==================== 绘制关系线 ====================

        // 生成大地线点（Great Circle弧线）
        function getArcPoints(start, end, segments = 80, arcFactor = 1.0) {
            const toRad = (deg) => deg * Math.PI / 180;
            const toDeg = (rad) => rad * 180 / Math.PI;

            const lat1 = toRad(start[0]);
            const lon1 = toRad(start[1]);
            const lat2 = toRad(end[0]);
            const lon2 = toRad(end[1]);

            // 计算角距（弧度）
            const d = 2 * Math.asin(Math.sqrt(
                Math.pow(Math.sin((lat2 - lat1) / 2), 2) +
                Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon2 - lon1) / 2), 2)
            ));

            // 如果两点距离很小，直接返回直线
            if (d < 0.01) {
                return [start, end];
            }

            const points = [];
            for (let i = 0; i <= segments; i++) {
                const f = (i / segments) * arcFactor;
                // 限制f在0到1之间，但可以超过1来增加弧度
                const fClamped = Math.min(f, 1);

                // 大地线插值公式
                const A = Math.sin((1 - fClamped) * d) / Math.sin(d);
                const B = Math.sin(fClamped * d) / Math.sin(d);

                const x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
                const y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
                const z = A * Math.sin(lat1) + B * Math.sin(lat2);

                const lat = Math.atan2(z, Math.sqrt(x * x + y * y));
                const lon = Math.atan2(y, x);

                points.push([toDeg(lat), toDeg(lon)]);
            }

            // 如果arcFactor > 1，需要延伸到终点
            if (arcFactor > 1 && arcFactor !== 1.0) {
                points.push(end);
            }

            return points;
        }

            const details = countryDetails[countryName];
            if (!details) return;

            const center = countryCenters[countryName];
            if (!center) return;

            // 解析盟友和敌对国家
            const parseCountries = (str) => {
                if (!str) return [];
                return str.split(/[、,，]/).map(s => s.trim()).filter(s => s);
            };

            const allies = parseCountries(details.allies);
            const enemies = parseCountries(details.enemies);

            // 绘制盟友线（绿色）- 抛物线
            allies.forEach(allyName => {

                        color: '#22c55e',

        // ==================== 创建图层 ====================
        function createCountriesLayer() {
            // 优先使用精确边界数据，否则使用嵌入数据
            const geoJSONData = preciseCountriesGeoJSON || countriesGeoJSON;
            return L.geoJSON(geoJSONData, {
                style: (feature) => {
                    const key = getCountryKey(feature.properties.name);
                    const details = key ? countryDetails[key] : null;

                    // 根据宗教派系确定颜色
                    let fillColor = '#888';
                    if (details) {
                        const religion = details.religion || '';
                        // 逊尼派 - 棕色/土黄色系
                        if (religion.includes('逊尼派') && !religion.includes('什叶派')) {
                            const colors = ['#C4A35A', '#B8956E', '#A68B5B', '#D4B896', '#C9A86C'];
                            fillColor = colors[key.charCodeAt(0) % colors.length];
                        }
                        // 什叶派 - 绿色系
                        else if (religion.includes('什叶派')) {
                            const colors = ['#2E8B57', '#3CB371', '#228B22', '#2E8B57', '#32CD32'];
                            fillColor = colors[key.charCodeAt(0) % colors.length];
                        }
                        // 犹太教 - 蓝色系
                        else if (religion.includes('犹太教')) {
                            const colors = ['#4169E1', '#1E90FF', '#6495ED', '#4169E1', '#5070D0'];
                            fillColor = colors[key.charCodeAt(0) % colors.length];
                        }
                        // 佛教 - 橙黄色系
                        else if (religion.includes('佛教')) {
                            const colors = ['#FF8C00', '#FFA500', '#FFB347', '#FF7F50', '#E65C00'];
                            fillColor = colors[key.charCodeAt(0) % colors.length];
                        }
                        // 其他/无特定 - 灰色系
                        else {
                            const colors = ['#808080', '#6B6B6B', '#787878', '#909090', '#696969'];
                            fillColor = colors[key.charCodeAt(0) % colors.length];
                        }
                    }

                    return {
                        fillColor: fillColor,
                        weight: 2, opacity: 1, color: 'white', fillOpacity: 0.6
                    };
                },
                onEachFeature: (feature, layer) => {
                    const key = getCountryKey(feature.properties.name);
                    if (!key) return;
                    layer.on({
                        click: (e) => {
                            // 清除之前的高亮
                            countriesLayer.eachLayer((l) => {
                                countriesLayer.resetStyle(l);
                            });
                            // 高亮当前国家
                            e.target.setStyle({ weight: 3, color: '#666', fillOpacity: 0.8 });
                            e.target.bringToFront();
                            updateCountryInfoPanel(key);
                            // 只有在国际关系按钮开启时才绘制关系线
                            if (state.showRelation) {
                                drawRelationshipLines(key);
                            }
                            // 只有在石油输出按钮开启时才绘制石油输出线
                            if (state.showOilExport) {
                                drawSingleCountryOilExport(key);
                            }
                        }
                    });
                }
            });
        }

        function createCountryLabels() {
            const group = L.layerGroup();
            for (const [key, coords] of Object.entries(countryCenters)) {
                const info = countryData[key];
                if (info) {
                    L.marker(coords, {
                        icon: L.divIcon({
                            className: 'country-label-wrapper',
                            html: `<div class="country-label">${info.flag} ${info.name}</div>`,
                            iconSize: [70, 20],
                            iconAnchor: [35, 10]
                        })
                    }).addTo(group);
                }
            }
            return group;
        }

        // ==================== 模式切换 ====================
        function updateDisplay() {
            // 移除所有层
            if (countriesLayer) map.removeLayer(countriesLayer);
            if (countryLabelsLayer) map.removeLayer(countryLabelsLayer);
            if (relationshipLinesLayer) map.removeLayer(relationshipLinesLayer);
            if (resourcesLayer) map.removeLayer(resourcesLayer);
            if (militaryLayer) map.removeLayer(militaryLayer);
            if (oilExportLayer) map.removeLayer(oilExportLayer);

            // 创建图层（如果不存在）
            if (!countriesLayer) countriesLayer = createCountriesLayer();
            if (!countryLabelsLayer) countryLabelsLayer = createCountryLabels();
            if (!resourcesLayer) resourcesLayer = createResourcesLayer();
            if (!militaryLayer) militaryLayer = createMilitaryLayer();

            // 根据状态添加图层
            if (state.showCountry) map.addLayer(countriesLayer);
            if (state.showLabel) map.addLayer(countryLabelsLayer);
            if (state.showRelation && relationshipLinesLayer) map.addLayer(relationshipLinesLayer);
            if (state.showResource) map.addLayer(resourcesLayer);
            if (state.showMilitary) map.addLayer(militaryLayer);
            if (state.showOilExport) {
                map.addLayer(oilExportLayer);
            }
        }

        // ==================== 按钮事件监听 ====================
        document.getElementById('btnCountry').addEventListener('click', function () {
            state.showCountry = !state.showCountry;
            this.classList.toggle('active', state.showCountry);
            updateDisplay();
        });

        document.getElementById('btnLabel').addEventListener('click', function () {
            state.showLabel = !state.showLabel;
            this.classList.toggle('active', state.showLabel);
            updateDisplay();
        });

        document.getElementById('btnRelation').addEventListener('click', function () {
            state.showRelation = !state.showRelation;
            this.classList.toggle('active', state.showRelation);
            updateDisplay();
        });

        document.getElementById('btnResource').addEventListener('click', function () {
            state.showResource = !state.showResource;
            this.classList.toggle('active', state.showResource);
            updateDisplay();
        });

        document.getElementById('btnMilitary').addEventListener('click', function () {
            state.showMilitary = !state.showMilitary;
            this.classList.toggle('active', state.showMilitary);
            updateDisplay();
        });

        document.getElementById('btnOilExport').addEventListener('click', function () {
            state.showOilExport = !state.showOilExport;
            this.classList.toggle('active', state.showOilExport);
            updateDisplay();
        });

        // ==================== 图例 ====================
        const legend = document.getElementById('legend');
        // 宗教派系图例
        const religionLegend = `
            <div class="legend-section">
                <h4>宗教派系</h4>
                <div class="legend-item"><div class="legend-color" style="background:#C4A35A"></div><span>逊尼派</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#2E8B57"></div><span>什叶派</span></div>
                <div class="legend-item"><div class="legend-color" style="background:#4169E1"></div><span>犹太教</span></div>
            </div>
        `;
        // 资源图例
        const resourceLegend = `
            <div class="legend-section">
                <h4>资源与港口</h4>
                <div class="legend-item"><div class="legend-color" style="background:rgba(139,69,19,0.9)"></div><span>⛽ 油田</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(255,140,0,0.9)"></div><span>⛽ 气田</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(30,144,255,0.9)"></div><span>💧 河流</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(34,139,34,0.9)"></div><span>🚢 港口</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(220,20,60,0.9)"></div><span>🏛️ 战略要地</span></div>
            </div>
        `;
        // 军事图例
        const militaryLegend = `
            <div class="legend-section">
                <h4>军事基地</h4>
                <div class="legend-item"><div class="legend-color" style="background:rgba(0,0,139,0.9)"></div><span>✈️🎖️⚓ 美军</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(139,0,0,0.9)"></div><span>✈️⚓ 俄军</span></div>
                <div class="legend-item"><div class="legend-color" style="background:rgba(128,0,128,0.9)"></div><span>🏔️ 战略要地</span></div>
            </div>
        `;
        // 石油输出图例
        const oilExportLegend = `
            <div class="legend-section">
                <h4>石油输出</h4>
                <div class="legend-item"><div class="legend-color" style="background:#FFD700"></div><span>🛢️ 石油输出线</span></div>
            </div>
        `;
        // 国家图例
        let countryLegend = '<div class="legend-section"><h4>国家</h4>';
        for (const [, info] of Object.entries(countryData)) {
            countryLegend += `<div class="legend-item"><span class="flag">${info.flag}</span><span>${info.name}</span></div>`;
        }
        countryLegend += '</div>';
        legend.innerHTML = religionLegend + resourceLegend + militaryLegend + oilExportLegend + countryLegend;

        // ==================== 初始化 ====================
        // 先用嵌入数据显示，再异步加载精确数据
        updateDisplay();

        // 异步加载精确边界数据
        loadBoundaryData().then(() => {
            // 重新渲染当前层以使用精确数据
            if (countriesLayer) {
                map.removeLayer(countriesLayer);
                countriesLayer = createCountriesLayer();
                map.addLayer(countriesLayer);
            }
        });
    </script>
</body>

</html>
